# Drop-in for the systemd unit that OWNS your tmux server.
# Install as: /etc/systemd/system/<your-tmux-unit>.service.d/memory.conf
# Apply with: systemctl daemon-reload   (cgroup properties re-assert on reload; NO restart
#                                        needed, so this can go on live without severing a session)
#
# Sizing below assumes a ~16 GB box; scale MemoryMax to leave the rest of the machine room.
#
# ---------------------------------------------------------------------------------------
# WHY MemoryHigh IS EXPLICITLY DISABLED. Do not "improve" this by adding a brake back.
#
# MemoryHigh imposes an allocation delay PROPORTIONAL TO OVERAGE. The cgroup therefore
# approaches MemoryMax ASYMPTOTICALLY AND NEVER ARRIVES: the in-cgroup OOM killer never
# fires, nothing dies, and so nothing recovers. A runaway stalls forever instead of dying.
# Measured on work-box 2026-08-29, twice, in the same hour:
#   MemoryHigh=9.5G under MemoryMax=10G -> hog crawled 9.50->9.94G over 150s,
#                                          memory.events high=34,525 max=0 oom_kill=0, ALIVE
#   MemoryHigh removed, same test        -> current hit 10.00G at t=12s, oom_kill=1 at t=18s,
#                                          constraint=CONSTRAINT_MEMCG, tmux server survived
# Gap size is not the variable: 2G failed on 08-20 and 08-24, 0.5G failed on 08-29. Any brake
# below the wall holds the wall out of reach. This mirrors builds.slice, which has carried
# "deliberately NO MemoryHigh - a build should die fast, not go slow" since 08-20.
#
# The early-warning role belongs to MONITORING, not to a throttle: orrery-memory-watch reads
# this cgroup and reports anon. A warning must never be a throttle that prevents the recovery
# it is warning about.
#
# ---------------------------------------------------------------------------------------
# WHY OOMPolicy=continue IS NOT OPTIONAL.
#
# The systemd default is OOMPolicy=stop. A tmux unit typically carries
# ExecStop=/usr/bin/tmux -L <socket> kill-server. With the default, an OOM kill of ANY process
# in the cgroup stops the unit, and ExecStop then destroys the tmux server AND EVERY SESSION
# IN IT. On work-box 2026-08-29 that chain turned one runaway into the loss of all four
# sessions. The ceiling alone only shrinks the blast radius from the BOX to the UNIT.
# OOMPolicy=continue lets the kernel kill just the runaway and leaves the server running.
# NOT OOMPolicy=kill: that sets memory.oom.group=1 and kills the whole cgroup - the very
# outcome being prevented.
#
# A resource LIMIT and a unit FAILURE POLICY are two different controls. Read MemoryMax,
# OOMPolicy and ExecStop as one set.
[Service]
MemoryAccounting=yes
MemoryHigh=infinity
MemoryMax=10G
MemorySwapMax=2G
OOMPolicy=continue
